name: Temporary Onpost sync permission check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: github.repository == 'aiminghee3/postiz-app'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Verify cross-fork PR and server merge of workflow-file changes
        env:
          GH_TOKEN: ${{ github.token }}
          PROBE_REPOSITORY: ${{ github.repository }}
          PROBE_SHA: 663e0a31d0e7fc27bba7703796f127a2fa716964
        run: |
          set -euo pipefail
          pr_number="$(gh api --method POST "repos/$PROBE_REPOSITORY/pulls" \
            -f base=onpost/permission-probe -f head=gitroomhq:main -f head_repo=postiz-app \
            -F maintainer_can_modify=false \
            -f title='Temporary upstream sync permission check' \
            -f body='Temporary verification in this fork only. Confirms the scoped Actions token can open an upstream update PR. The check merges upstream changes, including workflow files, into an expendable probe branch. This PR is automatically closed; no deployment occurs.' --jq .number)"
          trap 'gh api --method PATCH "repos/$PROBE_REPOSITORY/pulls/$pr_number" -f state=closed >/dev/null' EXIT
          gh api --method POST "repos/$PROBE_REPOSITORY/merges" \
            -f base=onpost/permission-probe -f head="$PROBE_SHA" >/dev/null
          status="$(gh api "repos/$PROBE_REPOSITORY/compare/$PROBE_SHA...onpost/permission-probe" --jq .status)"
          test "$status" = identical
          echo 'Cross-fork PR creation and workflow-file merge succeeded with GITHUB_TOKEN.' >> "$GITHUB_STEP_SUMMARY"
