name: Build Onpost release

on:
  push:
    branches: [onpost/release]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: onpost-release-build
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'aiminghee3/postiz-app' && github.ref == 'refs/heads/onpost/release'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NAME: ghcr.io/aiminghee3/onpost
    steps:
      - name: Check out the exact public release commit
        run: |
          git init source
          cd source
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD

      - name: Reclaim runner disk for the application image
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /usr/local/share/powershell /opt/ghc
          df -h /
          df -i /

      - name: Authenticate to this fork's container registry
        env:
          GH_TOKEN: ${{ github.token }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Build and push the branded image directly to the registry
        id: build
        working-directory: source
        run: |
          build_log=/tmp/onpost-buildx.log
          : > "$build_log"
          docker buildx build --progress=plain \
            --output=type=registry,compression=gzip,compression-level=1 \
            --platform linux/amd64 \
            --build-arg ONPOST_SOURCE_REF="$GITHUB_SHA" \
            -t "$IMAGE_NAME:sha-$GITHUB_SHA" \
            --metadata-file /tmp/onpost-image-metadata.json \
            -f Dockerfile.onpost . > "$build_log" 2>&1 &
          build_pid=$!
          elapsed=0
          last_line=0
          while kill -0 "$build_pid" 2>/dev/null; do
            sleep 20
            current_line="$(wc -l < "$build_log")"
            if [ "$current_line" -gt "$last_line" ]; then
              sed -n "$((last_line + 1)),$((current_line))p" "$build_log"
              last_line="$current_line"
            else
              printf 'BuildKit still active after %ss; waiting for image export\n' "$elapsed"
            fi
            elapsed=$((elapsed + 20))
          done
          set +e
          wait "$build_pid"
          build_status=$?
          set -e
          current_line="$(wc -l < "$build_log")"
          if [ "$current_line" -gt "$last_line" ]; then
            sed -n "$((last_line + 1)),$((current_line))p" "$build_log"
          fi
          test "$build_status" -eq 0
          digest="$(jq -r '.["containerimage.digest"]' /tmp/onpost-image-metadata.json)"
          test "${#digest}" -eq 71
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"

      - name: Verify public branding and exact source access
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          image="$IMAGE_NAME@$IMAGE_DIGEST"
          docker pull "$image"
          docker run --rm --entrypoint sh "$image" -c 'cmp /app/LICENSE /app/apps/frontend/public/open-source/LICENSE.txt'
          docker run --detach --name onpost-preview --entrypoint sh \
            -p 127.0.0.1:14200:4200 \
            -e MAIN_URL=https://onpost.me -e FRONTEND_URL=https://onpost.me \
            -e NEXT_PUBLIC_BACKEND_URL=https://onpost.me/api \
            -e IS_GENERAL=true -e DISABLE_REGISTRATION=true \
            "$image" -c 'cd /app/apps/frontend && pnpm exec next start -p 4200'
          trap 'docker logs --tail=50 onpost-preview; docker rm -f onpost-preview' EXIT
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:14200/auth/login -o /tmp/onpost-login.html && break
            sleep 2
          done
          grep -Fq 'Onpost Login' /tmp/onpost-login.html
          curl -fsS http://127.0.0.1:14200/ -o /tmp/onpost-home.html
          grep -Fq 'SNS 콘텐츠 준비부터 예약 발행까지' /tmp/onpost-home.html
          grep -Fq '댓글 자동 DM' /tmp/onpost-home.html
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:14200/)" = 200
          curl -sS -D /tmp/onpost-dashboard-headers -o /dev/null -H 'Cookie: auth=routing-check-only' http://127.0.0.1:14200/
          grep -Eiq '^location: (https?://[^/]+)?/launches' /tmp/onpost-dashboard-headers
          curl -sS -D /tmp/onpost-protected-headers -o /dev/null http://127.0.0.1:14200/launches
          grep -Eiq '^location: (https?://[^/]+)?/auth' /tmp/onpost-protected-headers
          curl -sS -D /tmp/onpost-invitation-headers -o /dev/null -H 'Cookie: org=invitation-routing-check' http://127.0.0.1:14200/
          grep -Eiq '^location: (https?://[^/]+)?/auth' /tmp/onpost-invitation-headers
          curl -sS -D /tmp/onpost-register-headers -o /dev/null http://127.0.0.1:14200/auth/register
          grep -Eiq '^location: (https?://[^/]+)?/auth/login' /tmp/onpost-register-headers
          for policy in privacy terms; do
            curl -fsS "http://127.0.0.1:14200/$policy" -o "/tmp/onpost-$policy.html"
            grep -Fq '303-19-95204' "/tmp/onpost-$policy.html"
          done
          curl -fsS http://127.0.0.1:14200/open-source -o /tmp/onpost-license.html
          grep -Fq "$GITHUB_SHA" /tmp/onpost-license.html
          grep -Fq 'Copyright (C) 2025 Nevo David' /tmp/onpost-license.html
          curl -fsS -H 'Cookie: auth=source-page-access-check' http://127.0.0.1:14200/open-source -o /tmp/onpost-authenticated-license.html
          grep -Fq "$GITHUB_SHA" /tmp/onpost-authenticated-license.html
          curl -fsS http://127.0.0.1:14200/open-source/LICENSE.txt -o /tmp/onpost-LICENSE
          cmp source/LICENSE /tmp/onpost-LICENSE

      - name: Record the verified immutable image
        run: |
          printf 'Image: `%s@%s`\nSource: https://github.com/%s/tree/%s\n' "$IMAGE_NAME" "${{ steps.build.outputs.digest }}" "$GITHUB_REPOSITORY" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
